    <!-- Custom CSS for dark theme, glassmorphism, gold accents, and animations -->
    <style>
        :root {
            --primary-gold: #D4AF37; /* Metallic Gold */
            --dark-charcoal: #2A2A2A; /* Matte Charcoal */
            --matte-black: #1A1A1A; /* Matte Black */
            --glass-bg-start: rgba(42, 42, 42, 0.2);
            --glass-bg-end: rgba(26, 26, 26, 0.1);
            --glass-border: rgba(212, 175, 55, 0.2);
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--matte-black);
            color: #E0E0E0;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Cinzel Decorative', serif;
            color: var(--primary-gold);
        }

        .gold-text {
            color: var(--primary-gold);
        }

        .gold-gradient-text {
            background: linear-gradient(90deg, #FFD700 0%, #DAA520 50%, #B8860B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        .btn-gold {
            @apply relative overflow-hidden bg-gradient-to-br from-yellow-500 to-amber-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-all duration-300 ease-in-out;
        }

        .btn-gold:hover {
            @apply scale-105 shadow-xl;
        }

        .btn-gold::before {
            content: '';
            @apply absolute inset-0 block bg-gradient-to-br from-yellow-300 to-amber-400 opacity-0;
            transition: opacity 0.3s ease-in-out;
            transform: scaleX(0);
            transform-origin: center;
        }

        .btn-gold:hover::before {
            @apply opacity-20;
            transform: scaleX(1);
        }

        /* Glassmorphism effect */
        .glass-card {
            background: linear-gradient(135deg, var(--glass-bg-start) 0%, var(--glass-bg-end) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 1rem; /* Adjust as needed */
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Hero Video Overlay with subtle particle effect */
        .hero-overlay::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6); /* Dark overlay */
            z-index: 1;
        }

        /* Subtle animated particles/light streaks */
        @keyframes subtleGlow {
            0% { transform: translate(-100%, -100%) scale(0.5); opacity: 0; }
            50% { opacity: 0.2; }
            100% { transform: translate(100%, 100%) scale(1.5); opacity: 0; }
        }

        .light-streak {
            position: absolute;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, var(--primary-gold) 0%, rgba(212, 175, 55, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            animation: subtleGlow 15s infinite ease-in-out;
            z-index: 2;
        }
        .light-streak:nth-child(1) { animation-delay: 0s; top: 10%; left: 10%; }
        .light-streak:nth-child(2) { animation-delay: 3s; top: 70%; left: 80%; width: 70px; height: 70px;}
        .light-streak:nth-child(3) { animation-delay: 6s; top: 40%; left: 30%; }
        .light-streak:nth-child(4) { animation-delay: 9s; top: 20%; left: 60%; width: 60px; height: 60px;}
        .light-streak:nth-child(5) { animation-delay: 12s; top: 80%; left: 20%; }

        /* Parallax effect for sections */
        .parallax {
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            background-color: var(--matte-black);
        }

        ::-webkit-scrollbar-thumb {
            background-color: var(--primary-gold);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: #f0c24e;
        }

        .text-glow {
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.8), 0 0 16px rgba(212, 175, 55, 0.4);
        }

        /* Booking calendar styling */
        .datepicker-grid {
            background-color: var(--matte-black) !important;
            border: 1px solid var(--primary-gold) !important;
            color: #E0E0E0 !important;

            background-color: var(--primary-gold) !important;
